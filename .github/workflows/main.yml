name: RSI Scanner

on:

  # ============================================================
  # MANUAL / GOOGLE SHEETS TRIGGER
  #
  # Google Apps Script triggers this workflow using:
  # GitHub Actions workflow_dispatch API
  #
  # No GitHub schedule is used.
  # ============================================================

  workflow_dispatch:


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: write


# ============================================================
# PREVENT OVERLAPPING RUNS
# ============================================================

concurrency:

  group: rsi-scanner

  cancel-in-progress: false


# ============================================================
# JOB
# ============================================================

jobs:

  scan:

    runs-on: ubuntu-latest

    timeout-minutes: 10


    steps:


      # ======================================================
      # 1. CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0


      # ======================================================
      # 2. SETUP PYTHON
      # ======================================================

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ======================================================
      # 3. INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies

        run: |

          echo "=========================================="
          echo "INSTALLING PYTHON DEPENDENCIES"
          echo "=========================================="

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ======================================================
      # 4. RUN RSI SCANNER
      # ======================================================

      - name: Run RSI scanner

        env:

          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}

          PYTHONIOENCODING: utf-8

          PYTHONUTF8: "1"

        run: |

          echo "=========================================="
          echo "RUNNING RSI SCANNER"
          echo "=========================================="

          echo ""

          echo "GitHub UTC time:"
          date -u

          echo ""

          echo "GitHub runner time:"
          date

          echo ""

          echo "Running Python scanner..."

          python RSI_Scanner_15min.py


      # ======================================================
      # 5. CLEAN OLD RSI SCANNER ARCHIVES
      #
      # Keep newest 20 timestamped scanner CSV files.
      #
      # Older RSI_Scanner_*.csv files are deleted.
      #
      # These important files are NEVER deleted:
      #
      # latest_results.csv
      # latest_results.json
      # RSI_History.csv
      #
      # ======================================================

      - name: Clean old scanner archives

        run: |

          echo "=========================================="
          echo "CLEANING OLD RSI SCANNER ARCHIVES"
          echo "=========================================="

          echo ""

          echo "Archive files BEFORE cleanup:"

          find . -maxdepth 1 -type f \
            -name 'RSI_Scanner_*.csv' \
            -printf '%f\n' \
            | sort -r

          echo ""

          # --------------------------------------------------
          # Count archive files
          # --------------------------------------------------

          ARCHIVE_COUNT=$(find . -maxdepth 1 -type f \
            -name 'RSI_Scanner_*.csv' \
            | wc -l)

          echo "Archive count before cleanup: $ARCHIVE_COUNT"

          echo ""

          # --------------------------------------------------
          # Keep newest 20 files.
          #
          # Filename format:
          #
          # RSI_Scanner_YYYY-MM-DD_HH-MM-SS.csv
          #
          # Reverse alphabetical sorting works because the
          # timestamp format sorts chronologically.
          # --------------------------------------------------

          echo "Keeping newest 20 archive files..."

          echo ""

          find . -maxdepth 1 -type f \
            -name 'RSI_Scanner_*.csv' \
            -printf '%f\n' \
            | sort -r \
            | tail -n +21 \
            | while read -r file
              do

                echo "Deleting old archive: $file"

                rm -f "$file"

              done

          echo ""

          echo "Archive files AFTER cleanup:"

          find . -maxdepth 1 -type f \
            -name 'RSI_Scanner_*.csv' \
            -printf '%f\n' \
            | sort -r

          echo ""

          ARCHIVE_COUNT_AFTER=$(find . -maxdepth 1 -type f \
            -name 'RSI_Scanner_*.csv' \
            | wc -l)

          echo "Archive count after cleanup: $ARCHIVE_COUNT_AFTER"

          echo ""

          echo "=========================================="
          echo "ARCHIVE CLEANUP COMPLETED"
          echo "=========================================="


      # ======================================================
      # 6. VERIFY SCANNER OUTPUT
      # ======================================================

      - name: Verify scanner output

        run: |

          echo "=========================================="
          echo "VERIFYING RSI SCANNER OUTPUT"
          echo "=========================================="

          echo ""

          echo "Repository files:"

          ls -lah

          echo ""

          echo "Checking required files..."

          # --------------------------------------------------
          # Required files
          # --------------------------------------------------

          test -f latest_results.csv

          test -f latest_results.json

          test -f RSI_History.csv

          echo ""

          echo "All required files found."

          echo ""

          # --------------------------------------------------
          # Latest CSV
          # --------------------------------------------------

          echo "Latest result file:"

          ls -lh latest_results.csv

          echo ""

          # --------------------------------------------------
          # Latest JSON
          # --------------------------------------------------

          echo "Latest JSON:"

          ls -lh latest_results.json

          echo ""

          # --------------------------------------------------
          # Validate JSON
          # --------------------------------------------------

          python -c "import json; d=json.load(open('latest_results.json', encoding='utf-8')); print('Latest JSON records:', len(d))"

          echo ""

          # --------------------------------------------------
          # RSI History
          # --------------------------------------------------

          echo "RSI History:"

          ls -lh RSI_History.csv

          echo ""

          # --------------------------------------------------
          # Archive count
          # --------------------------------------------------

          echo "Current scanner archive count:"

          find . -maxdepth 1 -type f \
            -name 'RSI_Scanner_*.csv' \
            | wc -l

          echo ""

          echo "=========================================="
          echo "VERIFICATION COMPLETED"
          echo "=========================================="


      # ======================================================
      # 7. COMMIT SCANNER OUTPUT
      #
      # IMPORTANT:
      #
      # We use:
      #
      #     git add -A
      #
      # instead of:
      #
      #     git add RSI_Scanner_*.csv
      #
      # because the old files have already been deleted.
      #
      # git add -A detects:
      #
      #   NEW       files
      #   MODIFIED  files
      #   DELETED   files
      #
      # ======================================================

      - name: Commit scanner output

        run: |

          echo "=========================================="
          echo "COMMITTING RSI SCANNER OUTPUT"
          echo "=========================================="

          echo ""

          # --------------------------------------------------
          # Configure Git
          # --------------------------------------------------

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo ""

          # --------------------------------------------------
          # Stage ALL repository changes
          #
          # This is important because old archive files
          # were deleted during cleanup.
          # --------------------------------------------------

          echo "Staging all repository changes..."

          git add -A

          echo ""

          # --------------------------------------------------
          # Show staged changes
          # --------------------------------------------------

          echo "=========================================="
          echo "STAGED FILES"
          echo "=========================================="

          echo ""

          git status --short

          echo ""

          # --------------------------------------------------
          # Show staged summary
          # --------------------------------------------------

          echo "=========================================="
          echo "CHANGE SUMMARY"
          echo "=========================================="

          echo ""

          git diff --cached --stat

          echo ""

          # ==================================================
          # COMMIT ONLY IF THERE ARE CHANGES
          # ==================================================

          if git diff --cached --quiet
          then

            echo "=========================================="
            echo "NO CHANGES DETECTED"
            echo "=========================================="

            echo ""

            echo "Nothing to commit."

          else

            echo "=========================================="
            echo "CHANGES DETECTED"
            echo "=========================================="

            echo ""

            git commit -m "Update RSI scanner data"

            echo ""

            echo "=========================================="
            echo "PUSHING CHANGES TO GITHUB"
            echo "=========================================="

            echo ""

            git push

            echo ""

            echo "=========================================="
            echo "RSI SCANNER DATA PUSHED SUCCESSFULLY"
            echo "=========================================="

          fi
