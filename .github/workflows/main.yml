name: RSI Scanner

on:

  # Manual testing
  workflow_dispatch:

  # ============================================================
  # RSI SCANNER SCHEDULE
  #
  # MONDAY-FRIDAY
  # INDIA TIME (IST)
  #
  # 09:15 AM to 03:30 PM
  # Every 15 minutes
  #
  # ============================================================

  schedule:

    # 09:17 IST = 03:47 UTC
    - cron: "47 3 * * 1-5"

    # 09:32, 09:47 IST = 04:02, 04:17 UTC
    # 10:02, 10:17, 10:32, 10:47 IST = 04:32, 04:47 UTC
    - cron: "2,17,32,47 4 * * 1-5"

    # 11:02 through 14:47 IST
    - cron: "2,17,32,47 5-9 * * 1-5"

    # 15:02, 15:17, 15:32 IST
    - cron: "2,17,32 10 * * 1-5"


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: write


# ============================================================
# PREVENT OVERLAPPING RUNS
# ============================================================

concurrency:
  group: rsi-scanner
  cancel-in-progress: false


jobs:

  scan:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # ========================================================
      # 2. PYTHON
      # ========================================================

      - name: Set up Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # ========================================================
      # 3. DEPENDENCIES
      # ========================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ========================================================
      # 4. RUN RSI SCANNER
      # ========================================================

      - name: Run RSI scanner

        env:

          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}

          PYTHONIOENCODING: utf-8

          PYTHONUTF8: "1"

        run: |

          echo "=========================================="
          echo "RUNNING RSI SCANNER"
          echo "=========================================="

          echo "GitHub UTC time:"
          date -u

          echo ""

          echo "GitHub local runner time:"
          date

          echo ""

          echo "Running scanner..."

          python RSI_Scanner_15min.py


      # ========================================================
      # 5. VERIFY OUTPUT
      # ========================================================

      - name: Verify scanner output

        run: |

          echo "=========================================="
          echo "RSI SCANNER OUTPUT"
          echo "=========================================="

          echo ""

          ls -lah

          echo ""

          echo "Checking required files..."

          test -f latest_results.csv

          test -f latest_results.json

          test -f RSI_History.csv

          echo ""

          echo "All required files found."

          echo ""

          echo "Latest result file:"
          ls -lh latest_results.csv

          echo ""

          echo "Latest JSON:"
          ls -lh latest_results.json

          echo ""

          python -c "import json; d=json.load(open('latest_results.json', encoding='utf-8')); print('Latest JSON records:', len(d))"

          echo ""

          echo "RSI History:"
          ls -lh RSI_History.csv


      # ========================================================
      # 6. COMMIT OUTPUT
      # ========================================================

      - name: Commit scanner output

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          echo "=========================================="
          echo "ADDING SCANNER FILES"
          echo "=========================================="


          # Dashboard + history files

          git add latest_results.csv

          git add latest_results.json

          git add RSI_History.csv


          # Timestamped archive reports

          git add RSI_Scanner_*.csv


          echo ""

          echo "=========================================="

          echo "STAGED FILES"

          echo "=========================================="


          git status --short


          # ====================================================
          # COMMIT ONLY IF SOMETHING CHANGED
          # ====================================================

          if git diff --cached --quiet; then

            echo ""

            echo "No changes to commit."

          else

            echo ""

            echo "Changes detected."

            git commit -m "Update RSI scanner data"

            git push

            echo ""

            echo "RSI scanner data pushed successfully."

          fi
